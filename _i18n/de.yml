    lineupAnnouncementTextPrefix: >
       Lassen Sie sich vom 19. Spektakel Landshut verzaubern! Freuen Sie sich auf ein außergewöhnliches Lineup mit Künstlern aus 17 verschiedenen Nationen, die mit ihrer Vielfalt und Kreativität begeistern. Von mitreißender Musik über atemberaubende Performances bis hin zu einzigartigen Kunstformen – das Spektakel bietet für jeden Geschmack etwas Besonderes. Entdecken Sie schon jetzt die beeindruckende Liste der eingeladenen Künstler auf unserer
    lineupAnnouncementTextInfix: Künstler-Seite
    lineupAnnouncementTextSuffix: >
      und lassen Sie sich inspirieren. Tauchen Sie ein in die Welt des Spektakels und erleben Sie die Magie, die Sie erwartet. Schauen Sie sich auch die folgenden YouTube-Videos an, um einen Vorgeschmack auf die unvergesslichen Momente zu bekommen, die Sie beim Spektakel Landshut erwarten!
