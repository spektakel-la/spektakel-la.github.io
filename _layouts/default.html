---
layout: compress
---
<!doctype html>
<html lang="{{ site.lang }}">
  {% include head.html %}

    <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id={{ site.data.settings.google-tagmanager-id }}"
        height="0"
        width="0"
        style="display:none;visibility:hidden"></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!-- Installation prompt for app -->
    <!-- <pwa-install></pwa-install> -->

    {% comment %}
      <div id="sw-loading">
      <div class="sw-loading-content">
      <img src="/assets/img/pages/sw-loading.svg" alt="New content loading..." />
      <div>{% t pages.default.loading %}</div>
      </div>
      </div>
    {% endcomment %}

    <div class="container">
      {% include header.html %}
      <div class="content-wrapper">
        {{ content }}
      </div>
      {% include footer.html %}
    </div>
  </body>

</html>
