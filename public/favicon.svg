<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Spektakel Landshut">
  <style>
    @font-face {
      font-family: 'Garnois';
      src: url('/assets/fonts/Garnois-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }

    rect {
      fill: #ff2d7a;
    }

    text {
      fill: #ffffff;
      font-family: 'Garnois', Impact, sans-serif;
      font-size: 58px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-anchor: middle;
      text-transform: uppercase;
    }

    .bottom {
      transform: scaleX(1.22);
      transform-origin: 64px 84px;
    }
  </style>
  <rect width="128" height="128" rx="18" />
  <text x="64" y="57">SP</text>
  <text class="bottom" x="64" y="108">LA</text>
</svg>
