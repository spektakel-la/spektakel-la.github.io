<head>
  <meta charset="utf-8">
  <meta http-equiv='content-language' content='de-de'>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% assign translations = site.translations[site.lang] %}
  <title>{{ translations.menu[page.title] }} | {{ site.title }}</title>

  <!-- Bing validation -->
  <meta name="msvalidate.01" content="2F5DB5C0DE9A9B48F95A61DFC20DB8C1" />

  <link rel="manifest" href="{{ "/manifest.json" | prepend: site.baseurl_root }}">
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | prepend: site.baseurl_root }}">


  <!-- Default consent -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }

    if (localStorage.getItem('consentMode') === null) {
      gtag('consent', 'default', {
        'functionality_storage': 'denied',
        'security_storage': 'denied',
        'ad_storage': 'denied',
        'ad_personalization': 'denied',
        'ad_user_data': 'denied',
        'analytics_storage': 'denied',
        'personalization_storage': 'denied',
      });
    } else {
      gtag('consent', 'default', JSON.parse(localStorage.getItem('consentMode')));
    }
  </script>

  <!-- Google Tag Manager -->
  <script>
    (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','{{ site.data.settings.google-tagmanager-id }}');
  </script>
  <!-- End Google Tag Manager -->

  <!-- cookieconsent -->
  <link rel="stylesheet" href="{{ "/assets/3rd-party/vanilla-cookieconsent/cookieconsent.css" | prepend: site.baseurl_root }}" crossorigin="anonymous"/>
  <script src="{{ "/assets/3rd-party/vanilla-cookieconsent/cookieconsent.umd.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>
  <script type="module" src="{{ "/assets/js/setup-cookieconsent.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>

  <!-- service-worker: cleanup-only, deregistriert alte SWs und leert Caches -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('{{ "/sw.js" | prepend: site.baseurl_root }}');
    }
  </script>

  <!-- font-awesome -->
  <link rel="stylesheet" href="{{ "/assets/3rd-party/font-awesome/css/font-awesome.min.css" | prepend: site.baseurl_root }}"  crossorigin="anonymous"/>

  <!-- Use Jekyll SEO plugin -->
  {% seo title=false %}

  <!-- Enforce a site-wide image for search-engines -->
  <meta property="og:image" content="{{ site.url }}{{ site.image_opaque }}">
  <meta property="og:image:url" content="{{ site.url }}{{ site.image_opaque }}">
  <meta property="og:image:secure_url" content="{{ site.url }}{{ site.image_opaque }}">
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="800">
  <meta property="og:image:height" content="1005">
  <meta property="og:image:alt" content="Website Image">

  {% if page.noindex %}
  <!-- Prevent search engines from indexing this page -->
  <meta name="robots" content="noindex, nofollow">
  {% endif %}

  {% include festival-meta.html %}

  <!-- date-fns -->
  <script src="{{ "/assets/3rd-party/date-fns/cdn.min.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>
  <script src="{{ "/assets/3rd-party/date-fns/locale/de/cdn.min.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>
  <script src="{{ "/assets/3rd-party/date-fns/locale/en-US/cdn.min.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="{{ "/assets/3rd-party/leaflet/dist/leaflet.css" | prepend: site.baseurl_root }}" crossorigin="anonymous"/>
  <script src="{{ "/assets/3rd-party/leaflet/dist/leaflet.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>

  <!-- Leaflet locate -->
  <link rel="stylesheet" href="{{ "/assets/3rd-party/leaflet.locatecontrol/dist/L.Control.Locate.min.css" | prepend: site.baseurl_root }}" crossorigin="anonymous"/>
  <script src="{{ "/assets/3rd-party/leaflet.locatecontrol/dist/L.Control.Locate.min.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>

  <!-- Leaflet fullscreen -->
  <link rel="stylesheet" href="{{ "/assets/3rd-party/leaflet.fullscreen/Control.FullScreen.css" | prepend: site.baseurl_root }}" crossorigin="anonymous"/>
  <script src="{{ "/assets/3rd-party/leaflet.fullscreen/Control.FullScreen.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>

  <!-- lightgallery -->
  <link rel="stylesheet" href="{{ "/assets/3rd-party/lightgallery/css/lightgallery-bundle.min.css" | prepend: site.baseurl_root }}" crossorigin="anonymous"/>
  <link type="text/css" rel="stylesheet" href="{{ "/assets/3rd-party/lightgallery/css/lg-autoplay.css" | prepend: site.baseurl_root }}" crossorigin="anonymous"/>
  <link type="text/css" rel="stylesheet" href="{{ "/assets/3rd-party/lightgallery/css/lg-fullscreen.css" | prepend: site.baseurl_root }}" crossorigin="anonymous"/>
  <link type="text/css" rel="stylesheet" href="{{ "/assets/3rd-party/lightgallery/css/lg-thumbnail.css" | prepend: site.baseurl_root }}" crossorigin="anonymous"/>
  <link type="text/css" rel="stylesheet" href="{{ "/assets/3rd-party/lightgallery/css/lg-zoom.css" | prepend: site.baseurl_root }}" crossorigin="anonymous"/>
  <script src="{{ "/assets/3rd-party/lightgallery/lightgallery.min.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>
  <script src="{{ "/assets/3rd-party/lightgallery/plugins/autoplay/lg-autoplay.min.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>
  <script src="{{ "/assets/3rd-party/lightgallery/plugins/fullscreen/lg-fullscreen.min.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>
  <script src="{{ "/assets/3rd-party/lightgallery/plugins/thumbnail/lg-thumbnail.min.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>
  <script src="{{ "/assets/3rd-party/lightgallery/plugins/zoom/lg-zoom.min.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>
  <script src="{{ "/assets/3rd-party/lightgallery/plugins/video/lg-video.min.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>

  <!-- sweetalert2 -->
  <link rel="stylesheet" href="{{ "/assets/3rd-party/sweetalert2/dist/sweetalert2.min.css" | prepend: site.baseurl_root }}" crossorigin="anonymous"/>
  <script src="{{ "/assets/3rd-party/sweetalert2/dist/sweetalert2.min.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>

  <!-- tippy.js -->
  <script src="{{ "/assets/3rd-party/@popperjs/core/dist/umd/popper.min.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>
  <script src="{{ "/assets/3rd-party/tippy.js/dist/tippy-bundle.umd.min.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="{{ "/assets/3rd-party/tippy.js/themes/light-border.css" | prepend: site.baseurl_root }}" crossorigin="anonymous"/>

  <!-- pwa-install -->
  <!-- <script src="{{ "/assets/3rd-party/@khmyznikov/pwa-install/dist/pwa-install.bundle.js" | prepend: site.baseurl_root }}charset="utf-8" crossorigin="anonymous"></script> -->

  <!-- custom js files -->
  <script src="{{ "/assets/js/header-scroll.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>
  <script src="{{ "/assets/js/constants.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>
  <script src="{{ "/assets/js/featuredetection.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>
  <script src="{{ "/assets/js/setup-swal.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>
  <script src="{{ "/assets/js/favorites.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>
  <script src="{{ "/assets/js/page-locations.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>
  <script src="{{ "/assets/js/page-program.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>
  <script src="{{ "/assets/js/popover.js" | prepend: site.baseurl_root }}" charset="utf-8" crossorigin="anonymous"></script>
</head>
