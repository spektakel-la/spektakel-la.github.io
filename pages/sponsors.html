---
layout: page
title: Unsere Sponsoren
permalink: /sponsors
---

<div class="sponsors-gallery">
    {% for sponsor in site.sponsors %}
        <div class="box">
            <a href="{{ sponsor.link }}" target="_blank">
                <picture>
                    <source srcset="{{ sponsor.image }}" type="image/webp">
                    <source srcset="{{ sponsor.image | replace:'.webp','.jpg' }}" type="image/jpeg">
                    <img src="{{ sponsor.image | replace:'.webp','.jpg' }}" alt="{{ sponsor.image }}">
                </picture>
            </a>
        </div>
    {% endfor %}
</div>
