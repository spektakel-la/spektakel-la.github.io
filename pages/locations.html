<div class="spektakel-leaflet-map"></div>

<script>
    const onShow = () => {
        spektakel.locations.sanityCheckSchedule();
        spektakel.locations.setupLeafletMap(document.querySelector('.spektakel-leaflet-map'), "{{ site.lang }}");
    }

    document.addEventListener("DOMContentLoaded", onShow);
    // window.addEventListener("pageshow", onShow);

    window.addEventListener("favoritesChanged", (event) => {
        const newFavorites = event.detail;

        // update the favorite background
        document.querySelectorAll(`.schedule-details[data-artist-id]`).forEach((scheduleDetail) => {
            const artistId = scheduleDetail.getAttribute('data-artist-id');
            if (newFavorites.includes(artistId)) {
                scheduleDetail.classList.add('favorite');
            } else {
                scheduleDetail.classList.remove('favorite');
            }
        });

        // update the favorite icon
        document.querySelectorAll(`i[data-artist-id]`).forEach((iconElement) => {
            const artistId = iconElement.getAttribute('data-artist-id');
            if (newFavorites.includes(artistId)) {
                iconElement.classList.add('fa-star');
                iconElement.classList.remove('fa-star-o');
            } else {
                iconElement.classList.add('fa-star-o');
                iconElement.classList.remove('fa-star');
            }
        });
    });
</script>
